
name: Campus DevOps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/chec    - name: Setup Docker Buildx
       up-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
           context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/campus_devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/campus_devops:${{ github.sha }}

